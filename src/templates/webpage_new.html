{% extends "base.html" %}

{% block title %}
  new page
{% endblock %}

{% block main_content %}
  <section class="form-panel">
    <header class="form-header">
      <h1 class="page-heading">New Article</h1>
    </header>
    <form class="editor-form" method="post">
      <div class="form-label">
        <label for="article-title">Article Title</label>
        <input id="article-title" type="text" name="title" required>
      </div>

      <div class="form-field">
        <label for="publishing-date">Publishing Date</label>
        <input id="publishing-date" type="datetime-local" name="publishing_date" required>
      </div>

      <div class="form-field">
        <label for="article-content">Content</label>
        <textarea id="article-content" name="content" rows="12" required></textarea>
      </div>

      <div class="form-action">
        <button class="button button-primary" type="submit">Publish</button>
      </div>
    </form>
  </section>
{% endblock %}
