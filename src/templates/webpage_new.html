{% extends "base.html" %}

{% block title %}
  New Page
{% endblock %}

{% block main_content %}
  <section class="form-panel">
    <header class="form-header">
      <h1 class="page-heading">New Article</h1>
    </header>

    <form class="editor-form" method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      >

      <div class="form-field">
        <label for="article-title">Article Title</label>
        <input
          id="article-title"
          type="text"
          name="title"
          maxlength="120"
          required
        >
      </div>

      <div class="form-field">
        <label for="publishing-date">Publishing Date</label>
        <input
          id="publishing-date"
          type="datetime-local"
          name="publishing_date"
          required
        >
      </div>

      <div class="form-field">
        <label for="article-content">Content</label>
        <textarea
          id="article-content"
          name="content"
          rows="12"
          maxlength="50000"
          required
        ></textarea>
      </div>

      <div class="form-actions">
        <button class="button button-primary" type="submit">Publish</button>
      </div>
    </form>
  </section>

  <footer class="page-footer">
    <a
      class="text-link"
      href="{{ url_for('adminpage_get_handler') }}"
    >
      Back to admin
    </a>
  </footer>
{% endblock %}
