{% extends "base.html" %}

{% block title %}
  Comment Page
{% endblock %}

{% block main_content %}
  <section class="form-panel">
    <header class="form-header">
      <h1 class="page-heading">Make Comment</h1>
    </header>

    <form method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      >

      <div class="form-field">
        <label for="comment-username">Username</label>
        <input
          id="comment-username"
          type="text"
          name="comment_username"
          maxlength="40"
          required
        >
      </div>

      <div class="form-field">
        <label for="comment-content">Comment Text</label>
        <textarea
          id="comment-content"
          name="comment_content"
          rows="6"
          maxlength="3000"
          required
        ></textarea>
      </div>

      <div class="form-actions">
        <button
          class="button button-primary"
          type="submit"
        >Publish</button>
      </div>
    </form>
  </section>

  <footer class="page-footer">
    <a
      class="text-link"
      href="{{ url_for('main.articlepage_get_handler', article_id=article_id)  }}"
    >
    Back to Article
    </a>
  </footer>
{% endblock %}
