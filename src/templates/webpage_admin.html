{% extends "base.html" %}

{% block title %}
  admin page
{% endblock %}

{% block main_content %}
  <strong>Personal Blog</strong>
  <a href="{{ url_for('newpage_get_handler') }}">+ Add</a>
  {% for article in articles_data %}
    <div>
      <span>{{article.article_title}}</span>
      <a href="{{ url_for('editpage_get_handler', edit_article_id=article.article_name) }}">Edit</a>
      <form method="post" action="{{ url_for('deletepage_post_handler', delete_id=article.article_name) }}">
        <button type="submit">Delete</button>
      </form>
    </div>
  {% else %}
    <p>There’s no any articles yet</p>
  {% endfor %}
{% endblock %}
