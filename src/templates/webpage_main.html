{% extends "base.html" %}

{% block title %}
  home page
{% endblock %}

{% block main_content %}
  <strong>Personal Blog</strong>
  {% for article in articles_data %}
    <div>
      <a>{{ article.article_name | capitalize }}</a>
      <span>{{ article.article_timestamp }}</span>
    </div>
  {% else %}
      <p>There’s no any articles yet!</p>
  {% endfor %}
{% endblock %}
