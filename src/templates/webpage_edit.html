{% extends "base.html" %}

{% block title %}
  Edit Page
{% endblock %}

{% block main_content %}
  <section class="form-panel">
    <header class="form-header">
      <h1 class="page-heading">Update Article</h1>
    </header>

    <form class="editor-form" method="post">
      <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
      >

      <div class="form-field">
        <label for="article-title">Article Title</label>
        <input
          id="article-title"
          type="text"
          name="title"
          maxlength="120"
          value="{{ article.title }}"
          required
        >
      </div>

      <div class="form-field">
        <label for="publishing-date">Publishing Date</label>
        <input
          id="publishing-date"
          type="datetime-local"
          name="publishing_date"
          value="{{ article.timestamp_raw }}"
          required
        >
      </div>

      <div class="form-field">
        <label for="article-content">Content</label>
        <textarea
          id="article-content"
          name="content"
          rows="12"
          maxlength="50000"
          required
        >{{ article.content }}</textarea>
      </div>

      <div class="form-actions">
        <button
          class="button button-primary"
          type="submit"
        >Update</button>
      </div>
    </form>

    <section class="comment-management">
      <header class="comment-management-header">
        <h2 class="comments-title">Manage Comments</h2>
      </header>

      <div class="comment-list">
        {% for comment in article.comments %}
          <article class="comment-card comment-edit-card">
            <header class="comment-header">
              <h3 class="comment-author">{{ comment.username }}</h3>
              <time
                datetime="{{ comment.timestamp_raw }}"
                class="comment-date"
              >{{ comment.timestamp }}</time>
            </header>

            <div class="comment-content">{{ comment.content }}</div>

            <form
              class="comment-delete"
              method="post"
              action="{{ url_for(
              'editpage_post_handler',
              edit_article_id=edit_article_id,
              deletion_comment_id=comment.comment_id,
            ) }}"
              onsubmit="return confirm('You sure you want to delete this comment?')"
            >
              <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
              >

              <button
                class="button button-danger"
                type="submit"
              >
                Delete comment
              </button>
            </form>
          </article>
        {% else %}
          <p class="empty-state">No comments yet!</p>
        {% endfor %}
      </div>
    </section>
  </section>
{% endblock %}
