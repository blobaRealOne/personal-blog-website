{% extends "base.html" %}

{% block title %}
  edit page
{% endblock %}

{% block main_content %}
  <section class="form-panel">
    <header class="form-header">
      <h1 class="page-heading">Update Article</h1>
    </header>

    <form class="editor-form" method="post">
      <div class="form-field">
        <label for="article-title">Article Title</label>
        <input
          id="article-title"
          type="text"
          name="title"
          value="{{ article.title }}"
          required
        >
      </div>

      <div class="form-field">
        <label for="publishing-date">Publishing Date</label>
        <input
          id="publishing-date"
          type="datetime-local"
          name="publishing_date"
          value="{{ article.timestamp }}"
          required
        >
      </div>

      <div class="form-field">
        <label for="article-content">Content</label>
        <textarea
          id="article-content"
          name="content"
          rows="12"
          required
        >{{ article.content }}</textarea>
      </div>

      <div class="form-actions">
        <button class="button button-primary" type="submit">Update</button>
      </div>
    </form>
  </section>
{% endblock %}
